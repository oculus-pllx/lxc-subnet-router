[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lxc-subnet-router"
version = "0.1.0"
description = "Proxmox LXC subnet router manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.29",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[project.scripts]
lxc-subnet-router = "lxc_subnet_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lxc_subnet_router = ["templates/*.html"]
